<ion-list *ngIf="(tasks$ | async)?.length; else elseTemplate">
  <app-task-item-sliding
    *ngFor="let task of tasks$ | async; trackBy: trackById"
    [task]="task"
  />
</ion-list>
<ng-template #elseTemplate>
  <ion-grid
    class="ion-no-padding"
  >
    <ion-row>
      <ion-col class="ion-text-center">
        <p>
          No results found...
        </p>
      </ion-col>
    </ion-row>
  </ion-grid>
</ng-template>
