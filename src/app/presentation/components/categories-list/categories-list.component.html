<ion-list>
  <ion-item-sliding
    *ngFor="let category of categories; trackBy: trackById"
    #slidingItem
  >
    <ion-item>
      <ion-label>{{ category.name }}</ion-label>
    </ion-item>
    <ion-item-options side="end">
      <ion-item-option
        color="warning"
        aria-label="Edit Category"
        (click)="onOpenCategoryModal(category, slidingItem)"
      >
        <ion-icon
          slot="icon-only"
          name="pencil"
          aria-hidden="true"
        ></ion-icon>
      </ion-item-option>
      <ion-item-option
        color="danger"
        aria-label="Delete Category"
        (click)="onDeleteCategory(category.id, slidingItem)"
      >
        <ion-icon
          slot="icon-only"
          name="trash"
          aria-hidden="true"
        ></ion-icon>
      </ion-item-option>
    </ion-item-options>
  </ion-item-sliding>
</ion-list>
