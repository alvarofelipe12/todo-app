<ion-item-sliding
  #slidingItem
>
  <ion-item [ngClass]="{ 'completed': task.completed }">
    <ion-label>{{ task.title }}</ion-label>
    <app-category-assignor-for-task [task]="task" />
  </ion-item>

  <ion-item-options side="start">
    <ion-item-option
      [color]="task.completed ? 'warning' : 'success'"
      (click)="toggleTask(task.id, slidingItem)"
    >
      <ion-icon
        slot="icon-only"
        [name]="task.completed ? 'arrow-undo' : 'checkmark'"
      >
      </ion-icon>
    </ion-item-option>
  </ion-item-options>
  <ion-item-options side="end">
    <ion-item-option
      color="danger"
      (click)="deleteTask(task.id, slidingItem)"
    >
      <ion-icon
        slot="icon-only"
        name="trash"
      ></ion-icon>
    </ion-item-option>
  </ion-item-options>
</ion-item-sliding>
